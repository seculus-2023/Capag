{% extends "base.html" %}{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-header">Alterar senha</div><div class="card-body">
<form method="post">{% csrf_token %}
{% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label><input type="password" name="{{ f.html_name }}" class="form-control" required>
{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary">Salvar</button> <a href="{% url 'dashboard' %}" class="btn btn-link">Cancelar</a>
</form></div></div></div></div>
{% endblock %}
